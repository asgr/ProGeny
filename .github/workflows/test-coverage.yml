on:
  push:
    branches: [main, master]
  pull_request:

name: test-coverage

permissions:
  contents: read

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::testthat, github::asgr/Rwcs@master, github::asgr/Rfits@master, github::asgr/ParmOff@main

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(quiet = FALSE)
          print(cov)
          covr::to_cobertura(cov, filename = "coverage.xml")
        shell: Rscript {0}

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
